<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Shadowing Player</title>
<style>
  :root {
    --bg: #111418; --panel: #1b2027; --line: #2a313b;
    --text: #f2f4f7; --sub: #9aa4b2; --accent: #4fb3ff; --accent2: #ffb84f;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif; }
  body { padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; }
  .week { color: var(--sub); font-size: 13px; margin: -6px 0 12px; }
  h1 { font-size: 18px; margin: 4px 0 12px; color: var(--sub); font-weight: 600; }

  .now { background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: 20px; min-height: 230px; display: flex; flex-direction: column; justify-content: center; }
  .meta { display: flex; justify-content: space-between; color: var(--sub); font-size: 14px; margin-bottom: 12px; }
  .phase { color: var(--accent2); font-weight: 700; }
  .en { font-size: 28px; line-height: 1.35; font-weight: 700; }
  .ja { font-size: 18px; color: var(--sub); margin-top: 12px; line-height: 1.5; }

  .controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 12px; margin: 16px 0; }
  .controls button { height: 88px; font-size: 30px; border-radius: 18px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); cursor: pointer; }
  .controls button#playBtn { background: var(--accent); color: #06121c; border: none; font-weight: 800; font-size: 26px; }
  .controls button#playBtn.playing { background: var(--danger); color: #fff; }
  .controls button:active { transform: scale(0.97); }

  details { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; }
  summary { padding: 14px 16px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .settings { padding: 4px 16px 16px; display: grid; gap: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; }
  .row label { color: var(--sub); flex-shrink: 0; }
  select, input[type=range] { flex: 1; max-width: 60%; }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 15px; }
  .val { min-width: 48px; text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg);
    color: var(--sub); font-size: 14px; cursor: pointer; }
  .chip.on { background: var(--accent); color: #06121c; border-color: var(--accent); font-weight: 700; }

  .list { padding: 0 8px 8px; }
  .item { display: flex; gap: 10px; padding: 10px 8px; border-top: 1px solid var(--line); cursor: pointer; }
  .item:first-child { border-top: none; }
  .item .n { color: var(--sub); width: 28px; flex-shrink: 0; text-align: right; font-size: 13px; padding-top: 2px; }
  .item .t { font-size: 15px; }
  .item .s { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .item.cur { background: rgba(79,179,255,0.12); border-radius: 8px; }
  .item .done { flex-shrink: 0; align-self: center; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--bg); color: var(--sub); font-size: 13px; cursor: pointer; }
  .item .done.on { background: #2e7d4f; border-color: #2e7d4f; color: #fff; font-weight: 700; }
  .donebar { display: flex; justify-content: space-between; align-items: center; padding: 0 16px 10px; color: var(--sub); font-size: 14px; }
  .note { color: var(--sub); font-size: 13px; line-height: 1.6; margin-top: 8px; }
  .warn { color: var(--accent2); }
</style>
</head>
<body>

<h1>Shadowing Player｜アスタナ取材用</h1>
<div class="week" id="week"></div>

<div class="now">
  <div class="meta"><span id="pos">– / –</span><span class="phase" id="phase">停止中</span></div>
  <div class="en" id="en">▶ を押すとスタートします</div>
  <div class="ja" id="ja">画面を見なくても、日本語→英語→シャドーイングの間→次の文、と自動で進みます。</div>
</div>

<div class="controls">
  <button id="prevBtn" aria-label="前の文">⏮</button>
  <button id="playBtn" aria-label="再生・一時停止">▶ スタート</button>
  <button id="nextBtn" aria-label="次の文">⏭</button>
</div>

<details open>
  <summary>⚙ 設定（運転前に決めておく）</summary>
  <div class="settings">
    <div class="row"><label>英語の声</label><select id="voiceSel"></select></div>
    <div class="row"><label>英語の速さ</label><input type="range" id="rate" min="0.5" max="1.3" step="0.05"><span class="val" id="rateV"></span></div>
    <div class="row"><label>日本語訳の読み上げ</label>
      <select id="jaMode">
        <option value="before">英語の前に読む</option>
        <option value="after">英語の後に読む</option>
        <option value="off">読まない</option>
      </select></div>
    <div class="row"><label>英語の前に考える間</label>
      <select id="think"><option value="0">なし</option><option value="2">2秒</option><option value="3">3秒</option><option value="5">5秒</option></select></div>
    <div class="row"><label>1文の繰り返し</label>
      <select id="repeat"><option>1</option><option>2</option><option>3</option><option>5</option></select></div>
    <div class="row"><label>シャドーイングの間</label><input type="range" id="gap" min="0.5" max="2.5" step="0.1"><span class="val" id="gapV"></span></div>
    <div class="row"><label>順番</label>
      <select id="order"><option value="seq">順番どおり</option><option value="shuffle">シャッフル</option></select></div>
    <div class="row"><label>最後まで行ったら</label>
      <select id="loop"><option value="1">最初に戻ってくり返す</option><option value="0">止まる</option></select></div>
    <div class="row"><label>「覚えた」文</label>
      <select id="skipDone"><option value="0">再生する</option><option value="1">飛ばす</option></select></div>
    <div>
      <div class="row" style="margin-bottom:8px"><label>場面で絞り込み</label></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="note">
      シャドーイングの間は「英文の長さ × この倍率」で自動で決まります。1.0倍なら英文と同じ長さの間が空きます。<br>
      「英語の前に考える間」は、日本語訳のあとに自分で英語を言ってみる時間です（覚えたかどうかの確認用）。<br>
      <span class="warn">設定や選曲は停車中に。運転中は画面に触らず、音声だけで使ってください。</span>
    </div>
  </div>
</details>

<details>
  <summary>📝 文の一覧（タップでその文から再生）</summary>
  <div class="donebar"><span id="doneCount"></span><button id="copyDone" class="chip">覚えた文をコピー</button></div>
  <div class="list" id="list"></div>
</details>

<script src="sentences.js"></script>
<script>
if (typeof SENTENCES === 'undefined' || !SENTENCES.length) {
  document.getElementById('en').textContent = 'sentences.js が読み込めませんでした';
  document.getElementById('ja').textContent = 'index.html と同じ場所に sentences.js があるか、書き方（カンマや " ）に誤りがないか確認してください。';
  throw new Error('SENTENCES not loaded');
}
if (typeof SENTENCES_WEEK !== 'undefined') document.getElementById('week').textContent = SENTENCES_WEEK;

// ---------- 設定の保存（使えない環境でも動くように） ----------
const STORE_KEY = 'shadowing-astana-settings';
function loadSettings() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
}
function saveSettings() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {}
}
const S = Object.assign({
  voice: '', rate: 0.85, jaMode: 'before', repeat: '2', gap: 1.2,
  order: 'seq', loop: '1', cats: [], think: '2', skipDone: '0'
}, loadSettings());

// ---------- 「覚えた」印（英文をキーに、この端末だけに保存） ----------
const DONE_KEY = 'shadowing-astana-done';
let DONE = [];
try { DONE = JSON.parse(localStorage.getItem(DONE_KEY)) || []; } catch (e) { DONE = []; }
const isDone = s => DONE.includes(s.en);
function toggleDone(s) {
  DONE = isDone(s) ? DONE.filter(x => x !== s.en) : [...DONE, s.en];
  try { localStorage.setItem(DONE_KEY, JSON.stringify(DONE)); } catch (e) {}
}

// ---------- 要素 ----------
const $ = id => document.getElementById(id);
const enEl = $('en'), jaEl = $('ja'), posEl = $('pos'), phaseEl = $('phase'), playBtn = $('playBtn');

// ---------- 状態 ----------
let queue = [];      // 再生する文のインデックス
let qi = 0;          // queue内の位置
let playing = false;
let runId = 0;       // 停止・スキップ時に古い再生を無効にするための番号
let wakeLock = null;

const synth = window.speechSynthesis;
let voices = [];

// ---------- 声の一覧 ----------
function loadVoices() {
  voices = synth.getVoices();
  const en = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  // イギリス英語を先頭に
  en.sort((a, b) => {
    const ga = a.lang.toLowerCase().includes('gb') ? 0 : 1;
    const gb = b.lang.toLowerCase().includes('gb') ? 0 : 1;
    return ga - gb || a.name.localeCompare(b.name);
  });
  const sel = $('voiceSel');
  sel.innerHTML = '';
  if (!en.length) {
    sel.innerHTML = '<option value="">（端末の標準の声）</option>';
    return;
  }
  en.forEach(v => {
    const o = document.createElement('option');
    o.value = v.name;
    o.textContent = (v.lang.toLowerCase().includes('gb') ? '🇬🇧 ' : '') + v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  });
  if (!S.voice || !en.find(v => v.name === S.voice)) S.voice = en[0].name;
  sel.value = S.voice;
}
loadVoices();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;

function enVoice() { return voices.find(v => v.name === S.voice) || null; }
function jaVoice() {
  return voices.find(v => v.lang && v.lang.toLowerCase().replace('_', '-').startsWith('ja')) || null;
}

// ---------- 読み上げ（終わるまで待つ） ----------
function speak(text, lang, rate, myRun) {
  return new Promise(resolve => {
    if (myRun !== runId) return resolve(0);
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = rate;
    const v = lang.startsWith('ja') ? jaVoice() : enVoice();
    if (v) u.voice = v;
    let started = 0;
    u.onstart = () => { started = performance.now(); };
    const done = () => resolve(started ? (performance.now() - started) / 1000 : estimate(text, rate));
    u.onend = done;
    u.onerror = done;
    synth.speak(u);
  });
}
function estimate(text, rate) { return Math.max(1.2, text.split(/\s+/).length * 0.38 / rate); }

function wait(sec, myRun) {
  return new Promise(resolve => {
    const t = setTimeout(resolve, sec * 1000);
    const check = setInterval(() => { if (myRun !== runId) { clearTimeout(t); clearInterval(check); resolve(); } }, 100);
    setTimeout(() => clearInterval(check), sec * 1000 + 50);
  });
}

// ---------- 画面表示 ----------
function show(idx, phase) {
  const s = SENTENCES[idx];
  enEl.textContent = s.en;
  jaEl.textContent = '【' + s.cat + '】' + s.ja;
  posEl.textContent = (qi + 1) + ' / ' + queue.length;
  phaseEl.textContent = phase;
  document.querySelectorAll('.item').forEach(el => el.classList.toggle('cur', Number(el.dataset.i) === idx));
}

// ---------- 再生の流れ ----------
async function runFrom(myRun) {
  while (playing && myRun === runId) {
    if (qi >= queue.length) {
      if (S.loop === '1') { buildQueue(true); qi = 0; }
      else { stop('最後まで再生しました'); return; }
    }
    const idx = queue[qi];
    const s = SENTENCES[idx];

    if (S.jaMode === 'before') {
      show(idx, '日本語');
      await speak(s.ja, 'ja-JP', 1.0, myRun);
      if (myRun !== runId) return;
      if (Number(S.think) > 0) {
        show(idx, '💭 英語で言ってみて');
        await wait(Number(S.think), myRun);
      } else {
        await wait(0.6, myRun);
      }
    }

    const reps = Number(S.repeat);
    for (let r = 0; r < reps; r++) {
      if (myRun !== runId) return;
      show(idx, '英語 ' + (r + 1) + '/' + reps);
      const dur = await speak(s.en, 'en-GB', Number(S.rate), myRun);
      if (myRun !== runId) return;
      show(idx, '🗣 あなたの番');
      await wait(dur * Number(S.gap) + 0.4, myRun);
    }

    if (S.jaMode === 'after') {
      if (myRun !== runId) return;
      show(idx, '日本語');
      await speak(s.ja, 'ja-JP', 1.0, myRun);
    }

    if (myRun !== runId) return;
    await wait(1.0, myRun);
    qi++;
  }
}

function buildQueue(reshuffle) {
  const cats = S.cats;
  let list = SENTENCES.map((s, i) => i).filter(i => !cats.length || cats.includes(SENTENCES[i].cat));
  if (S.skipDone === '1') { const rest = list.filter(i => !isDone(SENTENCES[i])); if (rest.length) list = rest; }
  if (!list.length) list = SENTENCES.map((s, i) => i);
  if (S.order === 'shuffle' && reshuffle !== false) {
    for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  }
  queue = list;
}

function start() {
  playing = true;
  runId++;
  playBtn.textContent = '⏸ 一時停止';
  playBtn.classList.add('playing');
  synth.cancel();
  runFrom(runId);   // iPhoneでは、ボタンを押した直後に読み上げを始める必要がある
  keepAwake();
}

function stop(msg) {
  playing = false;
  runId++;
  synth.cancel();
  playBtn.textContent = '▶ スタート';
  playBtn.classList.remove('playing');
  phaseEl.textContent = msg || '一時停止中';
  releaseAwake();
}

function jump(delta) {
  if (!queue.length) buildQueue();
  qi = Math.min(Math.max(0, qi + delta), queue.length - 1);
  show(queue[qi], playing ? '' : '一時停止中');
  if (playing) { runId++; synth.cancel(); runFrom(runId); }
}

// ---------- 画面を消さない（対応端末のみ） ----------
async function keepAwake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { wakeLock = null; }
}
function releaseAwake() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && playing) keepAwake();
});

// ---------- ボタン ----------
playBtn.onclick = () => {
  if (playing) { stop(); return; }
  if (!queue.length) { buildQueue(); qi = 0; }
  start();
};
$('prevBtn').onclick = () => jump(-1);
$('nextBtn').onclick = () => jump(1);

// ---------- 設定UI ----------
function bindSetting(id, key, fmt) {
  const el = $(id);
  el.value = S[key];
  const upd = () => { S[key] = el.value; if (fmt) $(id + 'V').textContent = fmt(el.value); saveSettings(); };
  el.addEventListener('input', upd);
  el.addEventListener('change', upd);
  if (fmt) $(id + 'V').textContent = fmt(el.value);
}
$('voiceSel').addEventListener('change', e => { S.voice = e.target.value; saveSettings(); });
bindSetting('rate', 'rate', v => Number(v).toFixed(2) + 'x');
bindSetting('gap', 'gap', v => Number(v).toFixed(1) + '倍');
bindSetting('jaMode', 'jaMode');
bindSetting('repeat', 'repeat');
bindSetting('loop', 'loop');
bindSetting('think', 'think');
$('skipDone').value = S.skipDone;
$('skipDone').addEventListener('change', e => { S.skipDone = e.target.value; saveSettings(); buildQueue(); qi = 0; });
$('order').value = S.order;
$('order').addEventListener('change', e => { S.order = e.target.value; saveSettings(); buildQueue(); qi = 0; });

// 場面チップ
const CATS = [...new Set(SENTENCES.map(s => s.cat))];
function renderChips() {
  const box = $('chips');
  box.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'chip' + (S.cats.length ? '' : ' on');
  all.textContent = 'すべて';
  all.onclick = () => { S.cats = []; afterCat(); };
  box.appendChild(all);
  CATS.forEach(c => {
    const b = document.createElement('button');
    const n = SENTENCES.filter(s => s.cat === c).length;
    b.className = 'chip' + (S.cats.includes(c) ? ' on' : '');
    b.textContent = c + ' ' + n;
    b.onclick = () => {
      S.cats = S.cats.includes(c) ? S.cats.filter(x => x !== c) : [...S.cats, c];
      afterCat();
    };
    box.appendChild(b);
  });
}
function afterCat() { saveSettings(); renderChips(); buildQueue(); qi = 0; if (playing) { runId++; synth.cancel(); runFrom(runId); } }

// 一覧
function renderList() {
  const box = $('list');
  box.innerHTML = '';
  SENTENCES.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'item';
    d.dataset.i = i;
    d.innerHTML = '<div class="n">' + (i + 1) + '</div><div style="flex:1"><div class="t"></div><div class="s"></div></div><button class="done"></button>';
    d.querySelector('.t').textContent = s.en;
    d.querySelector('.s').textContent = '【' + s.cat + '】' + s.ja + (s.keep ? '　📌固定' : '');
    const btn = d.querySelector('.done');
    const paint = () => { btn.classList.toggle('on', isDone(s)); btn.textContent = isDone(s) ? '✓ 覚えた' : '覚えた？'; };
    paint();
    btn.onclick = ev => { ev.stopPropagation(); toggleDone(s); paint(); updateDoneCount(); if (S.skipDone === '1') { buildQueue(); qi = 0; } };
    d.onclick = () => {
      S.cats = []; saveSettings(); renderChips();
      S.order = 'seq'; $('order').value = 'seq';
      buildQueue(false);
      qi = queue.indexOf(i);
      if (playing) { runId++; synth.cancel(); runFrom(runId); } else { show(i, '一時停止中'); }
    };
    box.appendChild(d);
  });
}

// 覚えた文の数とコピー（毎週の入れ替え相談用）
function updateDoneCount() {
  const n = SENTENCES.filter(isDone).length;
  $('doneCount').textContent = '覚えた文：' + n + ' / ' + SENTENCES.length;
}
$('copyDone').onclick = async () => {
  const list = SENTENCES.filter(isDone).map(s => s.en + (s.keep ? ' (固定)' : '')).join('\n');
  const text = '【覚えた文】\n' + (list || '（なし）');
  try { await navigator.clipboard.writeText(text); $('copyDone').textContent = 'コピーしました'; }
  catch (e) { prompt('この文をコピーしてください', text); }
  setTimeout(() => { $('copyDone').textContent = '覚えた文をコピー'; }, 2000);
};

renderChips();
renderList();
updateDoneCount();
buildQueue();

if (!('speechSynthesis' in window)) {
  enEl.textContent = 'このブラウザは音声読み上げに対応していません';
  playBtn.disabled = true;
}
</script>
</body>
</html>
